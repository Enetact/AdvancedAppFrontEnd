<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Club PWA</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A React + Vite + Bootstrap-ready PWA prototype." />
    <meta name="theme-color" content="#0d6efd" />

    <!-- Basic Open Graph -->
    <meta property="og:title" content="Club PWA" />
    <meta property="og:description" content="A React + Vite + Bootstrap-ready PWA prototype." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!-- Accessibility: skip link -->
    <a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 p-2 bg-white text-dark rounded" href="#app-root">
      Skip to content
    </a>

    <div id="root"></div>

    <!-- Bootstrap JS bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Vite entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
